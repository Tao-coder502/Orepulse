<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrePulse AI — Offline Mining Learning Laboratory</title>
  <meta name="description" content="OrePulse AI is an interactive agentic mining learning laboratory powered by Offline AI, Google ADK 2.0, and A2A multi-agent protocol." />
  <meta name="theme-color" content="#0c111a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service worker registered:', reg.scope))
          .catch(err => console.warn('[PWA] Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
